<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffb85c"><title>まなびのぼうけん</title><link rel="manifest" href="manifest.webmanifest"><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,'Hiragino Kaku Gothic ProN',sans-serif;background:linear-gradient(#fff0bd,#f6fcff);color:#53412c;min-height:100dvh}main{max-width:550px;margin:auto;padding:18px 16px 45px}.hero{background:#fff9e9;border:3px solid #ffce7c;border-radius:26px;padding:18px;text-align:center;box-shadow:0 6px #f7dba3}h1{font-size:26px;margin:6px 0}.animals{font-size:39px}.sub{font-size:13px}.tabs,.row{display:flex;gap:9px;margin:16px 0}.tabs button{flex:1;font-size:14px}button{border:0;border-radius:17px;padding:13px 12px;background:#ffd16d;color:#503b25;font-size:16px;font-weight:800;box-shadow:0 4px #dfac50;cursor:pointer;touch-action:manipulation}button:active{transform:translateY(3px);box-shadow:0 1px #dfac50}button.active{background:#ff9b7c;color:white}button:disabled{opacity:.45}.panel{background:#fff;border-radius:25px;padding:18px;margin-top:16px;border:2px solid #f2dcae;text-align:center}.hidden{display:none}.big{font-size:120px;color:#c8c2b5;line-height:1.4}.prompt{font-size:19px;font-weight:800;margin:5px 0 15px}.stars{font-size:24px;letter-spacing:5px;color:#edac25}.practice{position:relative;width:min(100%,330px);aspect-ratio:1;margin:10px auto;background:#fffdf6;border:3px dashed #f3c58c;border-radius:16px;overflow:hidden;touch-action:none}.practice .guide{position:absolute;inset:0;display:grid;place-items:center;font-size:230px;color:#e5e1d8;pointer-events:none}.practice:before{content:'';position:absolute;left:50%;height:100%;border-left:1px dashed #eee;pointer-events:none}.practice:after{content:'';position:absolute;top:50%;width:100%;left:0;border-top:1px dashed #eee;pointer-events:none}canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}.row button{flex:1}.small{font-size:13px;color:#867b6b}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.choices button{font-size:28px}.apples{font-size:42px;line-height:1.6;min-height:90px}.palette{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0}.swatch{width:43px;height:43px;border-radius:50%;border:3px solid white;box-shadow:0 0 0 1px #ddd;padding:0}.swatch.selected{outline:3px solid #6a98ef}.coloring{width:100%;max-width:330px;touch-action:manipulation}.coloring path,.coloring circle,.coloring ellipse{stroke:#544536;stroke-width:5;stroke-linejoin:round;cursor:pointer}.footer{text-align:center;margin:20px 0;font-size:13px}.pill{background:#f9e4a3;padding:5px 12px;border-radius:20px;display:inline-block}select{font-size:17px;border-radius:10px;padding:7px;border:2px solid #ffca74;background:white}</style></head><body><main><header class="hero"><div class="animals">🐰 🐻 🐼 🦊</div><h1>🌈 まなびのぼうけん</h1><div class="sub">あそんで、かいて、できた！をふやそう</div><p class="pill">⭐ ごほうび <strong id="total">0</strong> こ</p></header><nav class="tabs"><button class="active" data-tab="kana">✏️ もじ</button><button data-tab="count">🍎 かず</button><button data-tab="color">🎨 ぬりえ</button></nav><section id="kana" class="panel"><div class="animals">🐰</div><div class="prompt">ゆびで もじを かこう！</div><label>れんしゅうする もじ <select id="letter"></select></label><div class="practice"><div class="guide" id="guide">あ</div><canvas id="draw"></canvas></div><div class="stars" id="progress">☆☆☆☆☆</div><p class="small">1かい かいたら「かけた！」をおしてね</p><div class="row"><button id="clear">🧽 けす</button><button id="mark">⭐ かけた！</button></div><button id="nextLetter">つぎの もじ ➜</button><p class="small">※ 書き順・字形の自動判定はありません。おとなといっしょに練習してね。</p></section><section id="count" class="panel hidden"><div class="animals">🐻</div><div class="prompt">りんごは なんこ？</div><div class="apples" id="apples"></div><div class="choices" id="choices"></div><p id="countResult" aria-live="polite" class="prompt"></p><button id="nextCount">つぎの もんだい ➜</button></section><section id="color" class="panel hidden"><div class="animals">🦊</div><div class="prompt">すきないろで ぬろう！</div><div class="palette" id="palette"></div><svg class="coloring" viewBox="0 0 320 300" role="img" aria-label="くまのぬりえ"><path data-paint d="M75 100 C32 55 57 10 105 45 Q160 15 215 45 C263 10 288 55 245 100 Q291 139 272 210 Q251 279 160 277 Q69 279 48 210 Q29 139 75 100Z" fill="white"/><circle data-paint cx="104" cy="149" r="18" fill="white"/><circle data-paint cx="216" cy="149" r="18" fill="white"/><ellipse data-paint cx="160" cy="203" rx="48" ry="37" fill="white"/><circle cx="105" cy="151" r="6" fill="#544536" style="pointer-events:none"/><circle cx="215" cy="151" r="6" fill="#544536" style="pointer-events:none"/><ellipse cx="160" cy="193" rx="11" ry="8" fill="#544536" style="pointer-events:none"/><path d="M147 211 Q160 228 173 211" stroke="#544536" stroke-width="5" fill="none" style="pointer-events:none"/></svg><div class="row"><button id="resetColor">🔄 はじめから</button><button id="saveColor">📷 えを ほぞん</button></div><p class="small">いろをえらんで、くまのパーツをタップしてね。</p></section><footer class="footer">🌼 がんばったね！<br><span class="small">学習の記録はこの端末のブラウザに保存されます。</span><div style="margin-top:14px"><button id="resetStars">ごほうびをリセット</button></div></footer></main><script>const $=id=>document.getElementById(id);const key='manabi-v1';let state;try{state=JSON.parse(localStorage.getItem(key))||{stars:0}}catch{state={stars:0}};function save(){localStorage.setItem(key,JSON.stringify(state));$('total').textContent=state.stars}save();function reward(){state.stars++;save()}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));['kana','count','color'].forEach(id=>$(id).classList.toggle('hidden',id!==b.dataset.tab))});const letters=[...'あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわをん'];letters.forEach((x,i)=>{let o=document.createElement('option');o.value=i;o.textContent=x;$('letter').append(o)});let current=0,completed=0,ink=false;const canvas=$('draw'),ctx=canvas.getContext('2d');function resize(){let r=canvas.getBoundingClientRect(),ratio=window.devicePixelRatio||1;canvas.width=Math.round(r.width*ratio);canvas.height=Math.round(r.height*ratio);ctx.setTransform(ratio,0,0,ratio,0,0);ctx.lineWidth=12;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#f38c62';ink=false}window.addEventListener('resize',resize);requestAnimationFrame(resize);function pos(e){let r=canvas.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top]}let drawing=false;canvas.onpointerdown=e=>{drawing=true;canvas.setPointerCapture(e.pointerId);ctx.beginPath();ctx.moveTo(...pos(e));ctx.lineTo(...pos(e));ctx.stroke();ink=true};canvas.onpointermove=e=>{if(!drawing)return;ctx.lineTo(...pos(e));ctx.stroke()};canvas.onpointerup=()=>drawing=false;canvas.onpointercancel=()=>drawing=false;function clear(){ctx.clearRect(0,0,canvas.width,canvas.height);ink=false}$('clear').onclick=clear;function setLetter(i){current=i;$('letter').value=i;$('guide').textContent=letters[i];completed=0;updateProgress();clear()}function updateProgress(){$('progress').textContent='★'.repeat(completed)+'☆'.repeat(5-completed)}$('letter').onchange=e=>setLetter(+e.target.value);$('nextLetter').onclick=()=>setLetter((current+1)%letters.length);$('mark').onclick=()=>{if(!ink){alert('まずは ゆびで かいてみよう！');return}if(completed<5){completed++;reward();updateProgress();clear();if(completed===5)alert('すごい！ 5かい できたね！ 🎉')}};let answer=1;function newCount(){answer=1+Math.floor(Math.random()*10);$('apples').textContent='🍎'.repeat(answer);$('countResult').textContent='';let options=new Set([answer]);while(options.size<3)options.add(1+Math.floor(Math.random()*10));$('choices').innerHTML='';[...options].sort((a,b)=>a-b).forEach(n=>{let b=document.createElement('button');b.textContent=n;b.onclick=()=>{if(n===answer){$('countResult').textContent='🎉 せいかい！';if(!$('countResult').dataset.awarded){reward();$('countResult').dataset.awarded='1'}}else $('countResult').textContent='もういちど かぞえよう！'};$('choices').append(b)});$('countResult').dataset.awarded=''}$('nextCount').onclick=newCount;newCount();const colors=['#f5a0a8','#f5b34f','#f5e477','#91ce88','#8dcde9','#aa9cdd','#a57b5a','#ffffff'];let selected=colors[0];colors.forEach(c=>{let b=document.createElement('button');b.className='swatch';b.style.background=c;b.setAttribute('aria-label',c+'をえらぶ');b.onclick=()=>{selected=c;document.querySelectorAll('.swatch').forEach(x=>x.classList.toggle('selected',x===b))};$('palette').append(b)});$('palette').firstChild.classList.add('selected');document.querySelectorAll('[data-paint]').forEach(x=>x.addEventListener('click',()=>x.setAttribute('fill',selected)));$('resetColor').onclick=()=>document.querySelectorAll('[data-paint]').forEach(x=>x.setAttribute('fill','white'));$('saveColor').onclick=()=>{let svg=document.querySelector('.coloring').cloneNode(true);svg.setAttribute('xmlns','http://www.w3.org/2000/svg');let str=new XMLSerializer().serializeToString(svg),blob=new Blob([str],{type:'image/svg+xml'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='くまのぬりえ.svg';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('resetStars').onclick=()=>{if(confirm('ごほうびを 0こに もどしますか？')){state.stars=0;save()}};</script></body></html>
